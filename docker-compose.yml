services:
  app:
    image: node:20-alpine
    command:
      - node
      - -e
      - "require('http').createServer((req,res)=>res.end('Aplicacion funcionando')).listen(3000,'0.0.0.0')"
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - compose-net
    restart: unless-stopped

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin_compose}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mongo_compose_2026}
      MONGO_INITDB_DATABASE: compose_db
    volumes:
      - mongo-data:/data/db
    networks:
      - compose-net
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db-service
      PMA_PORT: 3306
    depends_on:
      - db-service
    networks:
      - compose-net
    restart: unless-stopped

  db-service:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_compose_2026}
      MYSQL_DATABASE: compose_db
      MYSQL_USER: admin_compose
      MYSQL_PASSWORD: ${MYSQL_USER_PASSWORD:-compose_pass_2026}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - compose-net
    restart: unless-stopped

volumes:
  mongo-data:
  mysql-data:

networks:
  compose-net:
    driver: bridge
